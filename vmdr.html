<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMDR | Qualys Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --qualys-red: #ED1C24; }
        .section-header { background: linear-gradient(to right, #f8fafc, #ffffff); }
        /* Smooth scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col">

    <nav class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-10">
        <div class="flex items-center gap-3">
            <img src="https://www.qualys.com/favicon.ico" class="h-7">
            <h1 class="text-xl font-bold tracking-tight text-slate-800 uppercase">Qualys <span class="text-slate-400 font-light text-sm">Portal Hub</span></h1>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <aside id="global-sidebar" class="w-64 bg-white border-r border-slate-200 py-6 shrink-0"></aside>

        <main class="flex-1 overflow-y-auto p-10 bg-slate-50">
            <div class="max-w-5xl mx-auto">
                
                <header class="mb-10">
                    <h2 class="text-3xl font-black text-slate-800 tracking-tight">VMDR Knowledge Base</h2>
                    <p class="text-slate-500 mt-2">Centralized resources for Vulnerability Management, Detection, and Response.</p>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                    <a href="https://qualysguard.qualys.com" target="_blank" rel="noopener" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:border-red-500 hover:shadow-md transition-all group">
                        <i class="fa-solid fa-right-to-bracket text-red-500 mb-4 text-xl"></i>
                        <h3 class="font-bold text-slate-800 group-hover:text-red-600">Platform Login</h3>
                        <p class="text-slate-500 text-[11px] mt-1">Access your Qualys instance.</p>
                    </a>

                    <a href="https://docs.qualys.com/en/vmdr/" target="_blank" rel="noopener" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:border-red-500 hover:shadow-md transition-all group">
                        <i class="fa-solid fa-book-open text-blue-500 mb-4 text-xl"></i>
                        <h3 class="font-bold text-slate-800 group-hover:text-red-600">User Guides</h3>
                        <p class="text-slate-500 text-[11px] mt-1">Setup and configuration docs.</p>
                    </a>

                    <a href="https://www.qualys.com/docs/qualys-api-v2-user-guide.pdf" target="_blank" rel="noopener" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:border-red-500 hover:shadow-md transition-all group">
                        <i class="fa-solid fa-terminal text-purple-600 mb-4 text-xl"></i>
                        <h3 class="font-bold text-slate-800 group-hover:text-red-600">VMDR API</h3>
                        <p class="text-slate-500 text-[11px] mt-1">V2 automation endpoints.</p>
                    </a>
                </div>

                <div id="article-sections-container" class="space-y-8">
                    <div class="p-10 text-center text-slate-400 animate-pulse text-sm italic">
                        Organizing resources by category...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 1. Sidebar Loader
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('global-sidebar').innerHTML = data;
                const page = window.location.pathname.split("/").pop() || "index.html";
                document.querySelectorAll('.nav-item').forEach(link => {
                    if (link.getAttribute('href') === page) {
                        link.classList.add('bg-slate-50', 'text-red-600', 'border-red-600');
                        link.classList.remove('border-transparent');
                    }
                });
            });

        // 2. CSV Logic (3-Column Format: title, link, category)
        async function fetchAndOrganizeLinks() {
            try {
                const response = await fetch('vmdr-links.csv');
                const data = await response.text();
                // Filter out empty rows and skip header
                const rows = data.split('\n').filter(row => row.trim() !== '').slice(1);
                
                const sections = {};

                rows.forEach(row => {
                    // Split by first two commas to handle 3 columns
                    const parts = row.split(',');
                    const title = parts[0]?.trim();
                    const link = parts[1]?.trim();
                    const category = parts[2]?.trim() || 'General';

                    if (title && link) {
                        if (!sections[category]) sections[category] = [];
                        sections[category].push({ title, link });
                    }
                });

                const container = document.getElementById('article-sections-container');
                container.innerHTML = '';

                // Sort categories alphabetically
                Object.keys(sections).sort().forEach(category => {
                    let sectionHTML = `
                        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                            <div class="px-6 py-4 section-header border-b border-slate-100 flex items-center justify-between">
                                <h3 class="font-black text-slate-700 text-[10px] uppercase tracking-widest">
                                    <i class="fa-solid fa-folder-open text-red-500 mr-2"></i> ${category}
                                </h3>
                                <span class="text-[9px] bg-slate-100 px-2 py-0.5 rounded text-slate-500 font-bold">${sections[category].length} ITEMS</span>
                            </div>
                            <div class="divide-y divide-slate-50">
                    `;

                    sections[category].forEach(item => {
                        sectionHTML += `
                            <a href="${item.link}" target="_blank" class="flex items-center justify-between px-6 py-4 hover:bg-slate-50 transition-colors group">
                                <div class="flex items-center gap-3">
                                    <i class="fa-regular fa-file-lines text-slate-300 group-hover:text-red-500 text-sm"></i>
                                    <span class="text-sm font-medium text-slate-600 group-hover:text-slate-900">${item.title}</span>
                                </div>
                                <i class="fa-solid fa-arrow-up-right-from-square text-slate-200 text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                            </a>
                        `;
                    });

                    sectionHTML += `</div></section>`;
                    container.innerHTML += sectionHTML;
                });

                if (Object.keys(sections).length === 0) {
                    container.innerHTML = '<div class="p-10 text-center text-slate-400">No links found in CSV.</div>';
                }

            } catch (err) {
                console.error(err);
                document.getElementById('article-sections-container').innerHTML = 
                    `<div class="p-10 text-red-500 text-center text-sm">Error loading CSV. Check if <b>vmdr-links.csv</b> has three columns: title, link, category.</div>`;
            }
        }

        fetchAndOrganizeLinks();
    </script>
</body>
</html>
