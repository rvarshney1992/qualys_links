<div class="mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
    <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="articleSearch" placeholder="Search articles, keywords..." 
               class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 focus:border-red-500 focus:ring-4 focus:ring-red-500/5 outline-none transition-all text-sm">
    </div>
    <div id="category-pills" class="flex gap-2 overflow-x-auto pb-2 w-full md:w-auto no-scrollbar">
        </div>
</div>

<div id="article-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    </div>

<script>
    async function fetchModernLibrary() {
        try {
            const response = await fetch('vmdr-links.csv');
            const data = await response.text();
            const rows = data.split('\n').filter(row => row.trim() !== '').slice(1);
            
            const sections = {};
            rows.forEach(row => {
                const [title, link, category] = row.split(',').map(item => item.trim());
                const cat = category || 'General';
                if (!sections[cat]) sections[cat] = [];
                sections[cat].push({ title, link });
            });

            const grid = document.getElementById('article-grid');
            const pills = document.getElementById('category-pills');
            grid.innerHTML = '';
            pills.innerHTML = `<button onclick="filterCat('All')" class="pill-active px-4 py-2 rounded-full text-xs font-bold transition-all border border-slate-200 bg-white text-slate-600 hover:border-red-500">All</button>`;

            Object.keys(sections).sort().forEach(cat => {
                // Add Pill
                pills.innerHTML += `<button onclick="filterCat('${cat}')" class="px-4 py-2 rounded-full text-xs font-bold transition-all border border-slate-200 bg-white text-slate-600 hover:border-red-500 whitespace-nowrap">${cat}</button>`;

                // Add Card
                let cardHTML = `
                    <div class="category-card bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-all p-6" data-category="${cat}">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-black text-slate-800 text-xs uppercase tracking-widest flex items-center gap-2">
                                <span class="h-2 w-2 rounded-full bg-red-500"></span> ${cat}
                            </h3>
                            <span class="text-[10px] font-bold text-slate-400">${sections[cat].length}</span>
                        </div>
                        <ul class="space-y-3">
                `;

                sections[cat].forEach(item => {
                    cardHTML += `
                        <li>
                            <a href="${item.link}" target="_blank" class="article-link flex items-start gap-3 group">
                                <i class="fa-regular fa-file-lines mt-1 text-slate-300 group-hover:text-red-500 transition-colors"></i>
                                <span class="text-sm text-slate-600 group-hover:text-slate-900 leading-snug transition-colors">${item.title}</span>
                            </a>
                        </li>
                    `;
                });

                cardHTML += `</ul></div>`;
                grid.innerHTML += cardHTML;
            });

            // SEARCH LOGIC
            document.getElementById('articleSearch').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.article-link').forEach(link => {
                    const isMatch = link.innerText.toLowerCase().includes(term);
                    link.closest('li').style.display = isMatch ? 'flex' : 'none';
                });
                // Hide cards if empty
                document.querySelectorAll('.category-card').forEach(card => {
                    const visibleLinks = card.querySelectorAll('li[style="display: flex;"]').length;
                    card.style.display = visibleLinks > 0 ? 'block' : 'none';
                });
            });

        } catch (err) { console.error(err); }
    }

    function filterCat(cat) {
        document.querySelectorAll('.category-card').forEach(card => {
            card.style.display = (cat === 'All' || card.dataset.category === cat) ? 'block' : 'none';
        });
    }

    fetchModernLibrary();
</script>
