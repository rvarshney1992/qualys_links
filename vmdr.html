<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMDR | Qualys Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --qualys-red: #ED1C24; }
        .sidebar-link:hover { border-left: 4px solid var(--qualys-red); background: #f8fafc; color: var(--qualys-red); }
        .active-page { border-left: 4px solid var(--qualys-red); background: #f8fafc; color: var(--qualys-red) !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col">

    <nav class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shrink-0 z-10">
        <div class="flex items-center gap-3">
            <img src="https://www.qualys.com/favicon.ico" class="h-7">
            <h1 class="text-xl font-bold tracking-tight">QUALYS <span class="text-slate-400 font-light text-sm uppercase">Resource Portal</span></h1>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-64 bg-white border-r border-slate-200 py-6 shrink-0">
            <nav class="space-y-1">
                <a href="index.html" class="sidebar-link flex items-center gap-3 px-6 py-4 font-bold text-slate-600">
                    <i class="fa-solid fa-house w-5"></i> Dashboard
                </a>
                <a href="vmdr.html" class="active-page flex items-center gap-3 px-6 py-4 font-bold text-slate-600">

                <a href="etm.html" class="sidebar-link flex items-center gap-3 px-6 py-4 font-bold text-slate-600">
                    <i class="fa-solid fa-gauge-high w-5"></i> ETM
                </a>
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto p-10">
            <div class="max-w-5xl">
                <h2 class="text-3xl font-black text-slate-800">VMDR Resources</h2>
                <p class="text-slate-500 mt-2 mb-10 border-b border-slate-200 pb-4">Vulnerability Management, Detection, and Response portal links.</p>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    
                    <a href="https://qualysguard.qualys.com" target="_blank" rel="noopener" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-red-500 transition-all flex flex-col h-full group">
                        <i class="fa-solid fa-right-to-bracket text-red-500 mb-4 text-xl"></i>
                        <h3 class="font-bold text-slate-800 group-hover:text-red-600">Platform Login</h3>

                        <div class="mt-auto pt-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Open Portal <i class="fa-solid fa-arrow-right ml-1"></i></div>
                    </a>
                    <a href="https://docs.qualys.com/en/vmdr/" target="_blank" rel="noopener" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-red-500 transition-all flex flex-col h-full group">

                        <h3 class="font-bold text-slate-800 group-hover:text-red-600">User Guides</h3>
                        <p class="text-slate-500 text-xs mt-2 leading-relaxed">Official documentation for scanning, reporting, and assets.</p>
                        <div class="mt-auto pt-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">View Docs <i class="fa-solid fa-arrow-right ml-1"></i></div>

                </div>
