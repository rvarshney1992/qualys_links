<section class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm mt-10">
    <div class="px-8 py-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <h3 class="font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-list-ul text-red-500"></i> Reference Articles
        </h3>
        <span id="link-count" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Loading...</span>
    </div>
    
    <div id="article-list-container" class="divide-y divide-slate-100">
        </div>
</section>

<script>
    async function fetchVmdrLinks() {
        try {
            const response = await fetch('vmdr-links.csv');
            const data = await response.text();
            
            // Split into lines and filter out empty ones
            const rows = data.split('\n').filter(row => row.trim() !== '');
            
            // Remove the header row (title,link)
            const contentRows = rows.slice(1);
            
            const container = document.getElementById('article-list-container');
            const countLabel = document.getElementById('link-count');
            
            container.innerHTML = ''; 
            countLabel.innerText = `${contentRows.length} Articles`;

            contentRows.forEach(row => {
                // Use a regex to split by the first comma only to protect URLs with commas
                const firstCommaIndex = row.indexOf(',');
                const title = row.substring(0, firstCommaIndex).trim();
                const link = row.substring(firstCommaIndex + 1).trim();

                if (title && link) {
                    const rowHTML = `
                        <a href="${link}" target="_blank" rel="noopener" class="flex items-center justify-between px-8 py-4 hover:bg-slate-50 transition-colors group">
                            <div class="flex items-center gap-4">
                                <i class="fa-solid fa-link text-slate-300 group-hover:text-red-500 transition-colors text-sm"></i>
                                <span class="text-sm font-semibold text-slate-700 group-hover:text-slate-900">${title}</span>
                            </div>
                            <i class="fa-solid fa-arrow-up-right-from-square text-slate-300 text-[10px] opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </a>
                    `;
                    container.innerHTML += rowHTML;
                }
            });
        } catch (error) {
            console.error('CSV Load Error:', error);
            document.getElementById('article-list-container').innerHTML = 
                '<div class="p-8 text-red-500 text-sm">Error loading links. Ensure vmdr-links.csv is in the root folder.</div>';
        }
    }

    // Run on page load
    fetchVmdrLinks();
</script>
