name: Daily security news

# Pulls cybersecurity headlines and Qualys ThreatPROTECT advisories, tags and
# correlates them, and rewrites links/news.json for news.html.
on:
  schedule:
    - cron: '0 10 * * *'   # daily 10:00 UTC (5:00 CT, 6:00 ET, 15:30 IST); GitHub may start it a little late
  workflow_dispatch:
    inputs:
      days:
        description: 'Look back this many days (duplicates are merged)'
        default: '3'

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news
        run: python scripts/update_news.py --days "${{ github.event.inputs.days || '3' }}"

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain links/news.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links/news.json
          git commit -m "Daily security news ($(date -u +%F))"
          # The weekly link refresh may have pushed in the meantime.
          git pull --rebase
          git push
