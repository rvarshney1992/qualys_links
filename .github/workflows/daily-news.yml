name: Daily security news

# Pulls cybersecurity headlines and Qualys ThreatPROTECT advisories, tags and
# correlates them, and rewrites links/news.json for news.html.
on:
  schedule:
    # 8:00 America/Chicago. Cron is UTC-only, so both offsets are scheduled and
    # the gate job below keeps whichever matches today's DST state.
    - cron: '0 13 * * *'   # 8:00 CDT (Mar-Nov)
    - cron: '0 14 * * *'   # 8:00 CST (Nov-Mar)
  workflow_dispatch:
    inputs:
      days:
        description: 'Look back this many days (duplicates are merged)'
        default: '3'

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # -0500 during CDT, -0600 during CST. Compare the trigger, not the clock,
          # so a late-starting run isn't skipped.
          if [ "$(TZ=America/Chicago date +%z)" = "-0500" ]; then want='0 13 * * *'; else want='0 14 * * *'; fi
          if [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 8:00 Chicago for this trigger; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news
        run: python scripts/update_news.py --days "${{ github.event.inputs.days || '3' }}"

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain links/news.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links/news.json
          git commit -m "Daily security news ($(date -u +%F))"
          # The weekly link refresh may have pushed in the meantime.
          git pull --rebase
          git push
